name: Publish approved Teleport package repositories

on:
  release:
    types: [published]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - deploy-teleport.sh
      - build-repo.sh
      - install-repo.sh
      - tests/deploy-test.sh
      - .github/workflows/teleport-packages.yml

permissions:
  contents: read

concurrency:
  group: teleport-repository-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      tp_sha256: ${{ steps.tp_checksum.outputs.sha256 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Release tags may point to old code; always use current publisher.
          ref: ${{ github.event.repository.default_branch }}
      - name: Validate deployment before publication
        run: |
          bash -n deploy-teleport.sh
          bash -n install-repo.sh
          bash tests/deploy-test.sh
      - name: Install repository index tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends createrepo-c rpm apt-utils dpkg-dev gnupg
      - name: Download, inspect and sign latest published Teleport Server and Connect packages
        env:
          GH_TOKEN: ${{ github.token }}
          TELEPORT_REPO_GPG_PRIVATE_KEY: ${{ secrets.TELEPORT_REPO_GPG_PRIVATE_KEY }}
          TELEPORT_REPO_GPG_PASSPHRASE: ${{ secrets.TELEPORT_REPO_GPG_PASSPHRASE }}
        run: bash build-repo.sh "$RUNNER_TEMP/teleport-site"
      - name: Record published installer checksum
        id: tp_checksum
        run: printf 'sha256=%s\n' "$(sha256sum "$RUNNER_TEMP/teleport-site/tp.sh" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/teleport-site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
  verify-public:
    needs: [build, deploy]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Verify exact public tp.sh URL against built artifact
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.tp_sha256 }}
        run: |
          set -Eeuo pipefail
          [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]
          url=https://flex0id.github.io/teleport/tp.sh
          for attempt in {1..18}; do
            if curl -4fsSL --proto '=https' --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache' "$url" -o "$RUNNER_TEMP/public-tp.sh" &&
              printf '%s  %s\n' "$EXPECTED_SHA256" "$RUNNER_TEMP/public-tp.sh" | sha256sum -c -; then
              grep -E '^VERSION=' "$RUNNER_TEMP/public-tp.sh"
              echo "Public installer verified: $url"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Published tp.sh does not match the artifact at the stable URL"
          exit 1
